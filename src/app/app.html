<main>
  <h1>Locaties</h1>

  <section>
    <h2>Adressen en recente locaties (key: postcode)</h2>
    <app-locatie-autocomplete
      key="postcode"
      [types]="['adres', 'recent']"
      placeholder="Zoek op postcode of adres"
      [formControl]="address"
    />
    <p>
      Waarde: <code>{{ address.value ?? 'geen' }}</code>
    </p>
  </section>

  <section>
    <h2>Stations (key: stationscode)</h2>
    <app-locatie-autocomplete
      key="stationscode"
      [types]="['station']"
      placeholder="Zoek een station"
      [formControl]="station"
    />
    <p>
      Waarde: <code>{{ station.value ?? 'geen' }}</code>
    </p>
  </section>

  <section>
    <h2>Alle types (key: plaats)</h2>
    <app-locatie-autocomplete key="plaats" placeholder="Zoek een plaats" [formControl]="anything" />
    <p>
      Waarde: <code>{{ anything.value ?? 'geen' }}</code>
    </p>
  </section>
</main>
