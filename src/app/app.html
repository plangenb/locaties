<main>
  <h1>Locaties</h1>

  <section>
    <h2>Adressen en recente locaties (key: postcode)</h2>
    <app-locatie-autocomplete
      key="postcode"
      [types]="['adres', 'recent']"
      placeholder="Zoek op postcode of adres"
      [formControl]="address"
    />
    <p>
      Waarde: <code>{{ describeValue(address.value) }}</code>
    </p>
  </section>

  <section>
    <h2>Stations (key: stationscode)</h2>
    <app-locatie-autocomplete
      key="stationscode"
      [types]="['station']"
      placeholder="Zoek een station"
      [formControl]="station"
    />
    <p>
      Waarde: <code>{{ describeValue(station.value) }}</code>
    </p>
  </section>

  <section>
    <h2>Alle types, met filter op stations (key: plaats)</h2>
    <app-locatie-autocomplete
      key="plaats"
      placeholder="Zoek een plaats"
      filterType="station"
      filterLabel="Alleen stations"
      [formControl]="anything"
    />
    <p>
      Waarde: <code>{{ describeValue(anything.value) }}</code>
    </p>
  </section>
</main>
